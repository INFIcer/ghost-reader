[mod-name]
ghost-reader=Ghost Reader

[mod-description]
ghost-reader=In vanilla Factorio, the tasks of construction robots cannot be read as circuit signals, yet this is crucial for automating construction. This mod focuses on solving that. It adds a new entity that reads the ghost requests within the whole surface or its logistics network and outputs them as circuit signals, fully configurable via a GUI. It supports adjusting the filter mode (entities | tiles | upgrades | items) and the quantity mode (supply requests | recycling requests).

