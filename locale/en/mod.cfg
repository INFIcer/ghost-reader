[mod-name]
ghost-reader=Ghost Reader

[mod-description]
ghost-reader=Adds a custom constant-combinator style entity (Ghost Reader) with a custom GUI panel. It reads the supply and recycling counts of buildings | tiles | upgrades | temporary item requests (ghost items placed on a tile in remote view), and outputs per-item circuit signals (net supply minus recycling, or supply only, or recycling only), either for the whole surface or for its logistics network's construction area.

