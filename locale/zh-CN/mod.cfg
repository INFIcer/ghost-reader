[mod-name]
ghost-reader=虚影读取器

[mod-description]
ghost-reader=在原版游戏中，建设机器人的任务无法通过信号获取，但这对于自动化建设非常重要，本 mod 着重解决此问题。mod 添加一个新实体，它读取所在表面或所在物流网络范围内的虚影数量并输出为电路信号，可使用 GUI 进行详细配置。支持调整筛选模式（实体|地格|升级|物品）和数量模式（供给请求|回收请求）。

[technology-name]
ghost-reader=虚影读取器

[entity-name]
ghost-reader=虚影读取器

[item-name]
ghost-reader=虚影读取器

[technology-description]
ghost-reader=可以读取所在表面或所在物流网络建设范围内的虚影

[item-description]
ghost-reader=可以读取所在表面或所在物流网络建设范围内的虚影

[gr-gui]
title=虚影读取器
range-mode=检索范围
mode-surface=表面
mode-surface-tooltip=读取当前表面上的建设机器人任务。
mode-network=物流网络
mode-network-tooltip=读取当前物流网络[color=green]建设区域[/color]内的建设机器人任务。\n\n将虚影读取器放置到某个物流网络的[color=green]物流区域[/color]内时，\n其被视作归属于该物流网络。\n\n[color=red]若未放置到任何物流网络的建设区域中，\n则不会读取任何内容。[/color]
current-range=当前范围
filter=类型筛选
filter-all=全部
filter-all-tooltip=统计所有类型的建设机器人任务。
filter-entity=实体
filter-entity-tooltip=统计实体虚影相关建设机器人任务。\n - 供给：待建的实体虚影\n - 回收：被标记拆除的实体\n\n[color=green]会统计因被摧毁而自动重建的实体虚影。[/color]
filter-tiles=地格
filter-tiles-tooltip=统计地形虚影相关建设机器人任务。\n - 供给：待铺的地形虚影\n - 回收：被标记拆除的地格
filter-upgrades=升级
filter-upgrades-tooltip=统计升级相关建设机器人任务。\n - 供给：升级后的目标实体\n - 回收：升级替换下的原实体
filter-items=物品
filter-items-tooltip=统计物品虚影相关建设机器人任务。\n - 供给：物品虚影\n - 回收：被标记回收的物品、\n被标记拆除实体内部的物品、\n环境实体的回收产物、落地物品\n\n[color=green]在远程视图下你可以在储物格上\n设置物品虚影或标记回收物品[/color]。\n[color=gray]（这些任务由[entity=construction-robot]建设机器人完成）[/color]\n\n[color=red]虚影读取器不会统计物流请求[/color]。\n[color=gray]（因为那是由[entity=logistic-robot]物流机器人完成的任务）[/color]
qty=数量模式
qty-net=供给 - 回收
qty-net-tooltip=输出的信号数量为供给数量减去回收数量（净需求量）。
qty-supply=仅供给
qty-supply-tooltip=输出的信号数量为供给数量。
qty-recycle=仅回收
qty-recycle-tooltip=输出的信号数量为回收数量。
quality=品质筛选
quality-all=全部
output=当前输出信号
network-prefix=网络#
