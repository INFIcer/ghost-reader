[mod-name]
ghost-reader=虚影读取器

[mod-description]
ghost-reader=添加一个自定义恒压器式实体（虚影读取器），带自定义 GUI 面板。它读取建筑|地格|升级|临时物品请求（远程视图下在储物格上放置的幽灵物品），并按物品把数量输出为电路信号，可选择整个表面或所在物流网络的建设范围。

